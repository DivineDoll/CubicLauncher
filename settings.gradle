pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

rootProject.name='CubicLauncher'
include ':app_cubic'

include ':forge_installer'
include ':NoBlocklist'
include ':glfw:jni_bindings'
include ':cubicexec:jni_bindings'
include ':sdl:jni_bindings'
